name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  debug-build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore GitHubExtension/GitHubExtension.csproj -r win-x64 -p:Platform=x64
          dotnet restore GitHubExtension.Tests/GitHubExtension.Tests.csproj -r win-x64 -p:Platform=x64

      - name: Build
        shell: pwsh
        run: |
          dotnet build GitHubExtension/GitHubExtension.csproj -r win-x64 --no-restore -p:Platform=x64 -p:GenerateAppxPackageOnBuild=false
          dotnet build GitHubExtension.Tests/GitHubExtension.Tests.csproj -r win-x64 --no-restore -p:Platform=x64 -p:GenerateAppxPackageOnBuild=false

      - name: Test
        shell: pwsh
        run: dotnet test GitHubExtension.Tests/GitHubExtension.Tests.csproj -r win-x64 --no-build -p:Platform=x64 -p:GenerateAppxPackageOnBuild=false

  release-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            platform: x64
            runner: windows-latest
            architecture: x64
            profile: win-x64
            test: true
          - runtime: win-arm64
            platform: ARM64
            runner: windows-11-arm
            architecture: arm64
            profile: win-arm64
            test: false
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x
          architecture: ${{ matrix.architecture }}

      - name: Restore application
        shell: pwsh
        run: dotnet restore GitHubExtension/GitHubExtension.csproj -r ${{ matrix.runtime }} -p:Platform=${{ matrix.platform }}

      - name: Restore test dependencies
        if: matrix.test
        shell: pwsh
        run: dotnet restore GitHubExtension.Tests/GitHubExtension.Tests.csproj -r win-x64 -p:Platform=x64

      - name: Release tests
        if: matrix.test
        shell: pwsh
        run: dotnet test GitHubExtension.Tests/GitHubExtension.Tests.csproj -c Release -r win-x64 --no-restore -p:Platform=x64 -p:GenerateAppxPackageOnBuild=false

      - name: Publish Release MSIX
        shell: pwsh
        run: dotnet publish GitHubExtension/GitHubExtension.csproj -c Release -r ${{ matrix.runtime }} --no-restore -p:Platform=${{ matrix.platform }} -p:PublishProfile=${{ matrix.profile }}

      - name: Validate package manifest and versions
        shell: pwsh
        run: |
          [xml] $manifest = Get-Content GitHubExtension/Package.appxmanifest
          $manifestIdentity = $manifest.SelectSingleNode('//*[local-name()="Identity"]')
          $version = $manifestIdentity.Version
          $architecture = if ('${{ matrix.runtime }}' -eq 'win-x64') { 'x64' } else { 'arm64' }
          $packages = @(Get-ChildItem "GitHubExtension/AppPackages/${{ matrix.runtime }}" -Filter '*.msix' -File -Recurse |
            Where-Object { $_.Name -match "_$([regex]::Escape($version))_$architecture\.msix$" })
          if ($packages.Count -ne 1) {
            throw "Expected one ${{ matrix.runtime }} MSIX package, found $($packages.Count)."
          }
          $makeappx = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) {
            throw 'makeappx.exe was not found in the Windows SDK.'
          }
          $unpackPath = Join-Path $env:TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $unpackPath | Out-Null
          try {
            & $makeappx.FullName unpack /p $packages[0].FullName /d $unpackPath /o
            if ($LASTEXITCODE -ne 0) {
              throw "makeappx unpack failed with exit code $LASTEXITCODE."
            }
            [xml] $packageManifest = Get-Content (Join-Path $unpackPath 'AppxManifest.xml') -Raw
            $identity = $packageManifest.SelectSingleNode('//*[local-name()="Identity"]')
            if ($identity.Name -ne 'BaldBeardedBuilder.GitHubforCommandPalette' -or
                $identity.Publisher -ne $manifestIdentity.Publisher -or
                $identity.Version -ne $version -or
                $identity.ProcessorArchitecture -ne $architecture) {
              throw 'Package manifest identity, publisher, version, or architecture does not match.'
            }
            $executable = Join-Path $unpackPath 'BaldBeardedBuilder.GitHubExtension.exe'
            if (-not (Test-Path $executable) -or
                [System.Diagnostics.FileVersionInfo]::GetVersionInfo($executable).FileVersion -ne $version) {
              throw 'Packaged executable is missing or its version does not match the manifest.'
            }
            $assembly = Get-ChildItem GitHubExtension/bin -Filter 'BaldBeardedBuilder.GitHubExtension.dll' -File -Recurse |
              Where-Object { $_.FullName.Contains("\Release\") -and $_.FullName.Contains("\${{ matrix.runtime }}\") -and $_.FullName -notmatch '\\(publish|ref)\\' } |
              Select-Object -First 1
            if (-not $assembly -or [System.Reflection.AssemblyName]::GetAssemblyName($assembly.FullName).Version.ToString() -ne $version) {
              throw 'Release assembly version does not match the package manifest.'
            }
          }
          finally {
            Remove-Item $unpackPath -Recurse -Force -ErrorAction SilentlyContinue
          }
