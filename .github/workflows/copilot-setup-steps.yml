name: Copilot Setup Steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x

      - name: Restore application dependencies
        shell: pwsh
        run: dotnet restore GitHubExtension\GitHubExtension.csproj -r win-x64

      - name: Restore test dependencies
        shell: pwsh
        run: dotnet restore GitHubExtension.Tests\GitHubExtension.Tests.csproj -r win-x64
